[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-audit"
version = "0.1.0"
description = "Standalone, stdlib-only, read-only security audit CLI for personal dev/agent infrastructure."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "chintheman" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Base tool is stdlib-only, by design -- see asa/ai_assist.py's docstring
# for why --ai doesn't need an optional dependency either (it uses
# urllib.request directly rather than a provider SDK).
dependencies = []

[project.urls]
Homepage = "https://github.com/chintheman/agent-security-audit"
Issues = "https://github.com/chintheman/agent-security-audit/issues"

[project.scripts]
asa = "asa.cli:main"

[tool.setuptools.packages.find]
include = ["asa*"]
